{% extends "base.html" %}
{% block content %}
<div class="card">
    <h1>Usuário criado</h1>
    <p><strong>Nome:</strong> {{ user.name }}</p>
    <p><strong>E-mail:</strong> {{ user.email }}</p>
    <p><strong>Perfil:</strong> {{ user.role }}</p>
    <p><strong>Password hash:</strong><br>{{ user.password_hash }}</p>
    <p class="muted">Perceba o ponto da aula: o sistema armazena hash, não a senha original.</p>
</div>
{% endblock %}
