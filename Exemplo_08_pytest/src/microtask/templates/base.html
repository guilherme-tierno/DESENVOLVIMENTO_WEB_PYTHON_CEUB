<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <title>{% block title %}MicroTask Helpdesk{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2em auto; padding: 0 1em; }
    nav { border-bottom: 1px solid #ccc; padding-bottom: 0.5em; margin-bottom: 1em; }
    nav a { margin-right: 1em; }
    .flash { padding: 0.5em 1em; margin: 0.5em 0; border-radius: 4px; }
    .flash.success { background: #d4edda; color: #155724; }
    .flash.danger  { background: #f8d7da; color: #721c24; }
    .flash.warning { background: #fff3cd; color: #856404; }
    .flash.info    { background: #d1ecf1; color: #0c5460; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border-bottom: 1px solid #eee; padding: 0.5em; text-align: left; }
    form label { display: block; margin: 0.5em 0 0.25em; }
    form input, form select, form textarea { width: 100%; padding: 0.4em; }
    button { padding: 0.5em 1em; cursor: pointer; }
  </style>
</head>
<body>
  <nav>
    <strong>MicroTask</strong> ·
    <a href="{{ url_for('pages.home') }}">Home</a>
    <a href="{{ url_for('pages.sobre') }}">Sobre</a>
    <a href="{{ url_for('tickets.lista') }}">Tickets</a>
    <a href="{{ url_for('users.lista') }}">Usuários</a>
  </nav>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="flash {{ cat }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <hr/>
    <small>Helpdesk Lite — exemplo didático</small>
  </footer>
</body>
</html>
