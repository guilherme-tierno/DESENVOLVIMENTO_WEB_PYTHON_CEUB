{% extends "base.html" %}
{% block title %}Usuários{% endblock %}
{% block content %}
  <h1>Usuários</h1>
  <p><a href="{{ url_for('users.criar_usuario') }}">+ Novo usuário</a></p>
  <table>
    <thead>
      <tr><th>Nome</th><th>E-mail</th><th>Perfil</th></tr>
    </thead>
    <tbody>
      {% for u in users %}
        <tr>
          <td>{{ u.name }}</td>
          <td>{{ u.email }}</td>
          <td>{{ u.role }}</td>
        </tr>
      {% else %}
        <tr><td colspan="3">Nenhum usuário cadastrado.</td></tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
