{% extends "base.html" %}
{% block title %}Usuário criado{% endblock %}
{% block content %}
  <h1>Usuário criado</h1>
  <p><strong>Nome:</strong> {{ user.name }}</p>
  <p><strong>E-mail:</strong> {{ user.email }}</p>
  <p><strong>Perfil:</strong> {{ user.role }}</p>
  <p><a href="{{ url_for('users.lista') }}">Voltar à lista</a></p>
{% endblock %}
