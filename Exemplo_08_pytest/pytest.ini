[pytest]
testpaths = tests
pythonpath = src
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers --color=yes
markers =
    slow: testes lentos (banco real, integração externa)
    auth: relacionados a autenticação e autorização
    crud: operações de CRUD
    security: testes de segurança (mass assignment, autorização, etc.)
filterwarnings =
    ignore::DeprecationWarning
